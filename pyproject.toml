[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yoloe-gauge-detector"
version = "0.1.0"
description = "Zero-shot industrial instrument detection with YOLOE text prompts"
requires-python = ">=3.10"
dependencies = [
  "ultralytics>=8.4.120,<8.5",
  "numpy>=1.23",
  "opencv-python>=4.8",
  "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gauge-detector = "gauge_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
markers = ["integration: requires a model checkpoint and may use the network"]
testpaths = ["tests"]
